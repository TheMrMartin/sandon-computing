<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandon School Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root {
    --ink: #ffffff;
    --ink-soft: rgba(255, 255, 255, 0.82);
    --green: #1b7a3d;
    --orange: #b95410;
    --red: #b3261e;
    --blue: #274690;
    --closed: #2a2f3a;
    --bg: var(--closed);
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding-inline: 16px;
    transition: background-color 0.6s ease;
  }
  body[data-state="green"] { --bg: var(--green); }
  body[data-state="orange"] { --bg: var(--orange); }
  body[data-state="red"] { --bg: var(--red); }
  body[data-state="blue"] { --bg: var(--blue); }
  body[data-state="closed"] { --bg: var(--closed); }

  main {
    min-height: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vh, 20px);
    text-align: center;
    padding-block: clamp(28px, 6vh, 56px);
  }
  .kicker {
    font-size: clamp(0.85rem, 2.2vw, 1.1rem);
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .time {
    font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(3rem, 16vw, 12rem);
    line-height: 0.95;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .desc {
    font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    font-weight: 500;
    font-size: clamp(2rem, 8vw, 5.5rem);
    line-height: 1.05;
    text-wrap: balance;
  }
  .remaining {
    margin-top: clamp(4px, 2vh, 20px);
    font-size: clamp(1.1rem, 3.6vw, 2rem);
    font-weight: 500;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    text-wrap: balance;
  }
  .remaining strong { color: var(--ink); font-weight: 600; }
  .controls {
    margin-top: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .timer-section {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding-block: clamp(24px, 6vh, 56px) clamp(32px, 8vh, 72px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    text-align: center;
    border-top: 1px solid rgba(255, 255, 255, 0.25);
  }
  .timer-kicker {
    font-size: clamp(0.85rem, 2.2vw, 1.1rem);
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .presets {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .presets-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .presets button, .timer-reset {
    font: 600 1rem/1 "Barlow", system-ui, sans-serif;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.1);
    border: 1.5px solid rgba(255, 255, 255, 0.55);
    border-radius: 999px;
    padding: 11px 20px;
    cursor: pointer;
  }
  .presets button[aria-pressed="true"] {
    background: #ffffff;
    color: #1d222c;
  }
  .presets button:focus-visible, .timer-reset:focus-visible {
    outline: 2px solid #ffffff;
    outline-offset: 2px;
  }
  .timer-display {
    font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(2.6rem, 11vw, 4.6rem);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .timer-display.finished { color: #ffe58a; }
  .timer-status {
    font-size: clamp(0.95rem, 2.6vw, 1.15rem);
    font-weight: 500;
    color: var(--ink-soft);
    min-height: 1.4em;
  }
  .timer-reset { display: none; }
  .timer-reset.visible { display: inline-block; }
  .tt-link {
    font: 600 1rem/1 "Barlow", system-ui, sans-serif;
    color: var(--ink);
    text-underline-offset: 4px;
    text-decoration-thickness: 1.5px;
    padding: 6px 4px;
  }
  .tt-link:focus-visible, .tt-close:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 2px;
  }
  .tt-dialog {
    width: min(760px, calc(100vw - 32px));
    max-height: calc(100vh - 48px);
    padding: 0;
    border: 0;
    border-radius: 14px;
    background: #f7f8fa;
    color: #1d222c;
    font-family: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  .tt-dialog::backdrop { background: rgba(10, 12, 18, 0.6); }
  .tt-head {
    position: sticky;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    background: #f7f8fa;
    border-bottom: 1px solid #d8dce3;
  }
  .tt-head h2 {
    margin: 0;
    font: 600 1.6rem/1.1 "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  .tt-close {
    font: 600 0.95rem/1 "Barlow", system-ui, sans-serif;
    color: #1d222c;
    background: #ffffff;
    border: 1.5px solid #9aa2b1;
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
  }
  .tt-tables {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    padding: 16px 20px 22px;
  }
  .tt-table {
    width: 100%;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
  }
  .tt-table caption {
    text-align: left;
    font: 600 1.15rem/1.2 "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    padding-bottom: 8px;
  }
  .tt-table.is-today caption::after {
    content: " (today)";
    font-weight: 500;
    color: #4a5263;
  }
  .tt-table th, .tt-table td {
    padding: 7px 10px;
    border-bottom: 1px solid #e1e4ea;
    text-align: left;
    font-weight: 400;
  }
  .tt-table thead th {
    font-size: 0.85rem;
    font-weight: 600;
    color: #4a5263;
    border-bottom: 1.5px solid #9aa2b1;
  }
  .tt-table td { text-align: right; }
  .tt-table thead th:not(:first-child) { text-align: right; }
  .tt-table tr.is-period th { font-weight: 600; }
  .tt-table tbody tr:nth-child(odd) { background: #eaedf2; }
  .tt-table tbody tr[aria-current] {
    background: var(--bg);
    color: #ffffff;
  }
  .tt-table tbody tr[aria-current] th, .tt-table tbody tr[aria-current] td { border-bottom-color: transparent; }
  @media (prefers-reduced-motion: reduce) {
    body { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="kicker" id="kicker">Mr Martin's Clock @ The Sandon School</div>
  <div class="time" id="time">--</div>
  <div class="desc" id="desc"></div>
  <div class="remaining" id="remaining"></div>
  <div class="controls">
    <a href="#timetable" class="tt-link" id="ttOpen">View timetable</a>
  </div>
</main>

<dialog id="timetable" class="tt-dialog" aria-labelledby="ttTitle">
  <div class="tt-head">
    <h2 id="ttTitle">School day timetable</h2>
    <button type="button" class="tt-close" id="ttClose">Close</button>
  </div>
  <div class="tt-tables" id="ttTables"></div>
</dialog>

<section class="timer-section">
  <div class="timer-kicker">Timer</div>
  <div class="presets" role="group" aria-label="Timer duration">
    <div class="presets-row">
      <button type="button" data-seconds="30">30s</button>
      <button type="button" data-seconds="60">1m</button>
      <button type="button" data-seconds="120">2m</button>
      <button type="button" data-seconds="180">3m</button>
    </div>
    <div class="presets-row">
      <button type="button" data-seconds="300">5m</button>
      <button type="button" data-seconds="600">10m</button>
      <button type="button" data-seconds="900">15m</button>
      <button type="button" data-seconds="1200">20m</button>
    </div>
  </div>
  <div class="timer-display" id="timerDisplay">--:--</div>
  <div class="timer-status" id="timerStatus">Choose a duration to start.</div>
  <button type="button" class="timer-reset" id="timerReset">Stop</button>
</section>

<script>
  // Timetables in minutes after midnight. The last entry ends the school day.
  // Each session: [start, end, label, kind], in minutes after midnight.
  var MON_THU = [
    [8 * 60 + 25, 8 * 60 + 50, "Enrichment", "other"],
    [8 * 60 + 50, 8 * 60 + 55, "Changeover", "other"],
    [8 * 60 + 55, 9 * 60 + 55, "Period 1", "period"],
    [9 * 60 + 55, 10 * 60, "Changeover", "other"],
    [10 * 60, 11 * 60, "Period 2", "period"],
    [11 * 60, 11 * 60 + 20, "Break", "other"],
    [11 * 60 + 20, 12 * 60 + 20, "Period 3", "period"],
    [12 * 60 + 20, 12 * 60 + 25, "Changeover", "other"],
    [12 * 60 + 25, 13 * 60 + 25, "Period 4", "period"],
    [13 * 60 + 25, 13 * 60 + 55, "Lunch", "other"],
    [13 * 60 + 55, 14 * 60 + 55, "Period 5", "period"]
  ];
  var FRIDAY = [
    [8 * 60 + 25, 8 * 60 + 35, "Enrichment", "other"],
    [8 * 60 + 35, 8 * 60 + 40, "Changeover", "other"],
    [8 * 60 + 40, 9 * 60 + 40, "Period 1", "period"],
    [9 * 60 + 40, 9 * 60 + 45, "Changeover", "other"],
    [9 * 60 + 45, 10 * 60 + 45, "Period 2", "period"],
    [10 * 60 + 45, 11 * 60 + 5, "Break", "other"],
    [11 * 60 + 5, 12 * 60 + 5, "Period 3", "period"],
    [12 * 60 + 5, 12 * 60 + 10, "Changeover", "other"],
    [12 * 60 + 10, 13 * 60 + 10, "Period 4", "period"],
    [13 * 60 + 10, 13 * 60 + 40, "Lunch", "other"],
    [13 * 60 + 40, 14 * 60 + 40, "Period 5", "period"]
  ];

  var fmt = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/London",
    weekday: "short",
    hour: "numeric",
    minute: "numeric",
    second: "numeric",
    hourCycle: "h23"
  });

  function londonNow() {
    var out = {};
    fmt.formatToParts(new Date()).forEach(function (p) { out[p.type] = p.value; });
    return {
      weekday: out.weekday,
      seconds: (+out.hour) * 3600 + (+out.minute) * 60 + (+out.second)
    };
  }

  function clockText(secs) {
    var h = Math.floor(secs / 3600) % 24;
    var m = Math.floor((secs % 3600) / 60);
    var sec = secs % 60;
    function pad(n) { return (n < 10 ? "0" : "") + n; }
    return pad(h) + ":" + pad(m) + ":" + pad(sec);
  }

  function remainingText(secs) {
    var m = Math.floor(secs / 60);
    var s = secs % 60;
    if (m >= 60) {
      var h = Math.floor(m / 60);
      return h + " hr " + (m % 60) + " min";
    }
    if (m === 0) return s + " s";
    return m + " min " + (s < 10 ? "0" : "") + s + " s";
  }

  var els = {
    time: document.getElementById("time"),
    desc: document.getElementById("desc"),
    remaining: document.getElementById("remaining")
  };

  // --- Timetable pop-up -----------------------------------------------
  var current = { table: null, index: -1 };
  var ttDialog = document.getElementById("timetable");
  var ttTables = document.getElementById("ttTables");

  function hhmm(mins) {
    var h = Math.floor(mins / 60), m = mins % 60;
    return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
  }

  function buildTable(caption, table) {
    var wrap = document.createElement("div");
    wrap.className = "tt-block";
    var t = document.createElement("table");
    t.className = "tt-table";
    t._source = table;
    var cap = document.createElement("caption");
    cap.textContent = caption;
    t.appendChild(cap);
    var head = document.createElement("thead");
    head.innerHTML = "<tr><th scope=\"col\">Session</th><th scope=\"col\">Start</th><th scope=\"col\">End</th></tr>";
    t.appendChild(head);
    var body = document.createElement("tbody");
    for (var i = 0; i < table.length; i++) {
      var tr = document.createElement("tr");
      if (table[i][3] === "period") tr.className = "is-period";
      var th = document.createElement("th");
      th.scope = "row";
      th.textContent = table[i][2];
      var a = document.createElement("td");
      a.textContent = hhmm(table[i][0]);
      var b = document.createElement("td");
      b.textContent = hhmm(table[i][1]);
      tr.appendChild(th); tr.appendChild(a); tr.appendChild(b);
      body.appendChild(tr);
    }
    t.appendChild(body);
    wrap.appendChild(t);
    return wrap;
  }

  ttTables.appendChild(buildTable("Monday to Thursday", MON_THU));
  ttTables.appendChild(buildTable("Friday", FRIDAY));

  function markCurrentRow() {
    Array.prototype.forEach.call(ttTables.querySelectorAll("table"), function (t) {
      var today = t._source === current.table;
      t.classList.toggle("is-today", today);
      Array.prototype.forEach.call(t.tBodies[0].rows, function (row, i) {
        if (today && i === current.index) row.setAttribute("aria-current", "time");
        else row.removeAttribute("aria-current");
      });
    });
  }

  function openTimetable() {
    markCurrentRow();
    if (!ttDialog.open) ttDialog.showModal();
  }

  function clearHash() {
    if (location.hash === "#timetable") {
      try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    }
  }

  document.getElementById("ttOpen").addEventListener("click", function (e) {
    e.preventDefault();
    try { history.replaceState(null, "", "#timetable"); } catch (err) {}
    openTimetable();
  });
  document.getElementById("ttClose").addEventListener("click", function () { ttDialog.close(); });
  ttDialog.addEventListener("click", function (e) { if (e.target === ttDialog) ttDialog.close(); });
  ttDialog.addEventListener("close", clearHash);
  window.addEventListener("hashchange", function () {
    if (location.hash === "#timetable") openTimetable();
  });

  function tick() {
    var now = londonNow();
    var weekend = now.weekday === "Sat" || now.weekday === "Sun";
    var table = now.weekday === "Fri" ? FRIDAY : MON_THU;
    var s = now.seconds;
    var state = "closed";
    var desc = "The Sandon School is closed.";
    var remaining = "";
    current.table = weekend ? null : table;
    current.index = -1;

    if (!weekend) {
      for (var i = 0; i < table.length; i++) {
        var seg = table[i];
        var start = seg[0] * 60, end = seg[1] * 60;
        var next = table[i + 1];
        if (s >= start && s < end) {
          current.index = i;
          desc = seg[2];
          if (seg[3] === "period") {
            var elapsed = s - start;
            state = elapsed < 45 * 60 ? "green" : elapsed < 55 * 60 ? "orange" : "red";
          } else {
            state = "blue";
          }
          var target = !next ? "the end of the school day"
            : next[0] === seg[1] ? next[2]
            : "the end of " + seg[2];
          remaining = "<strong>" + remainingText(end - s) + "</strong> until " + target;
          break;
        }
        // Short unnamed gap between two sessions (none in the current timetable)
        if (next && s >= end && s < next[0] * 60) {
          state = "blue";
          desc = "Between lessons";
          remaining = "<strong>" + remainingText(next[0] * 60 - s) + "</strong> until " + next[2];
          break;
        }
      }
    }

    document.body.setAttribute("data-state", state);
    els.time.textContent = clockText(s);
    els.desc.textContent = desc;
    els.remaining.innerHTML = remaining;
    document.title = clockText(s) + " " + desc.replace(/\.$/, "");
    if (ttDialog.open) markCurrentRow();
  }

  tick();
  setInterval(tick, 500);
  if (location.hash === "#timetable") openTimetable();

  // --- Timer ---------------------------------------------------------
  var audioCtx = null;
  function unlockAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().catch(function () {});
    }
  }

  // A soft four-note bell arpeggio, in the spirit of a station announcement
  // chime, rather than a recording of any particular network's jingle.
  function playChime() {
    if (!audioCtx) return;
    var now = audioCtx.currentTime;
    var notes = [659.25, 783.99, 987.77, 1318.51];
    notes.forEach(function (freq, i) {
      var t = now + i * 0.19;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.28, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0008, t + 1.3);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 1.35);
    });
  }

  var timerDisplay = document.getElementById("timerDisplay");
  var timerStatus = document.getElementById("timerStatus");
  var timerResetBtn = document.getElementById("timerReset");
  var presetButtons = Array.prototype.slice.call(document.querySelectorAll(".presets button"));
  var timerEndAt = null;
  var timerLabel = "";
  var timerHandle = null;

  function mmss(totalSeconds) {
    var m = Math.floor(totalSeconds / 60);
    var s = totalSeconds % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function clearActivePreset() {
    presetButtons.forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
  }

  function stopTimer(resetText) {
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
    timerEndAt = null;
    clearActivePreset();
    timerDisplay.classList.remove("finished");
    timerDisplay.textContent = "--:--";
    timerStatus.textContent = resetText || "Choose a duration to start.";
    timerResetBtn.classList.remove("visible");
  }

  function timerTick() {
    var remaining = Math.round((timerEndAt - Date.now()) / 1000);
    if (remaining <= 0) {
      clearInterval(timerHandle);
      timerHandle = null;
      timerDisplay.textContent = "00:00";
      timerDisplay.classList.add("finished");
      timerStatus.textContent = "Time's up (" + timerLabel + ")";
      timerResetBtn.textContent = "Reset";
      playChime();
      return;
    }
    timerDisplay.textContent = mmss(remaining);
    timerStatus.textContent = "Counting down from " + timerLabel + "…";
  }

  presetButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      unlockAudio();
      var secs = parseInt(btn.getAttribute("data-seconds"), 10);
      timerLabel = btn.textContent;
      if (timerHandle) clearInterval(timerHandle);
      clearActivePreset();
      btn.setAttribute("aria-pressed", "true");
      timerEndAt = Date.now() + secs * 1000;
      timerDisplay.classList.remove("finished");
      timerDisplay.textContent = mmss(secs);
      timerStatus.textContent = "Counting down from " + timerLabel + "…";
      timerResetBtn.classList.add("visible");
      timerResetBtn.textContent = "Stop";
      timerHandle = setInterval(timerTick, 250);
    });
  });

  timerResetBtn.addEventListener("click", function () {
    stopTimer("Choose a duration to start.");
  });
</script>
</body>
</html>
