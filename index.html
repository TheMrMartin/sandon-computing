<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandon School Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root {
    --ink: #ffffff;
    --ink-soft: rgba(255, 255, 255, 0.82);
    --green: #1b7a3d;
    --orange: #b95410;
    --red: #b3261e;
    --blue: #274690;
    --closed: #2a2f3a;
    --bg: var(--closed);
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding-inline: 16px;
    transition: background-color 0.6s ease;
  }
  body[data-state="green"] { --bg: var(--green); }
  body[data-state="orange"] { --bg: var(--orange); }
  body[data-state="red"] { --bg: var(--red); }
  body[data-state="blue"] { --bg: var(--blue); }
  body[data-state="closed"] { --bg: var(--closed); }

  main {
    min-height: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vh, 20px);
    text-align: center;
    padding-block: clamp(28px, 6vh, 56px);
  }
  .kicker {
    font-size: clamp(0.85rem, 2.2vw, 1.1rem);
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .time {
    font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(5rem, 24vw, 17rem);
    line-height: 0.95;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .desc {
    font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    font-weight: 500;
    font-size: clamp(2rem, 8vw, 5.5rem);
    line-height: 1.05;
    text-wrap: balance;
  }
  .remaining {
    margin-top: clamp(4px, 2vh, 20px);
    font-size: clamp(1.1rem, 3.6vw, 2rem);
    font-weight: 500;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    text-wrap: balance;
  }
  .remaining strong { color: var(--ink); font-weight: 600; }
  .time.with-seconds {
    font-size: clamp(3rem, 14vw, 11rem);
  }
  .controls {
    margin-top: clamp(12px, 4vh, 40px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .format {
    display: inline-flex;
    border: 1.5px solid rgba(255, 255, 255, 0.55);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .format button {
    font: 600 0.95rem/1 "Barlow", system-ui, sans-serif;
    letter-spacing: 0.04em;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
  }
  .format button[aria-pressed="true"] {
    background: #ffffff;
    color: #1d222c;
  }
  .format button:focus-visible {
    outline: 2px solid #ffffff;
    outline-offset: 2px;
  }
  .timer-section {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding-block: clamp(24px, 6vh, 56px) clamp(32px, 8vh, 72px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    text-align: center;
    border-top: 1px solid rgba(255, 255, 255, 0.25);
  }
  .timer-kicker {
    font-size: clamp(0.85rem, 2.2vw, 1.1rem);
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .presets {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .presets-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .presets button, .timer-reset {
    font: 600 1rem/1 "Barlow", system-ui, sans-serif;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.1);
    border: 1.5px solid rgba(255, 255, 255, 0.55);
    border-radius: 999px;
    padding: 11px 20px;
    cursor: pointer;
  }
  .presets button[aria-pressed="true"] {
    background: #ffffff;
    color: #1d222c;
  }
  .presets button:focus-visible, .timer-reset:focus-visible {
    outline: 2px solid #ffffff;
    outline-offset: 2px;
  }
  .timer-display {
    font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(2.6rem, 11vw, 4.6rem);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .timer-display.finished { color: #ffe58a; }
  .timer-status {
    font-size: clamp(0.95rem, 2.6vw, 1.15rem);
    font-weight: 500;
    color: var(--ink-soft);
    min-height: 1.4em;
  }
  .timer-reset { display: none; }
  .timer-reset.visible { display: inline-block; }
  @media (prefers-reduced-motion: reduce) {
    body { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="kicker" id="kicker">Mr Martin's Clock @ The Sandon School</div>
  <div class="time" id="time">--</div>
  <div class="desc" id="desc"></div>
  <div class="remaining" id="remaining"></div>
  <div class="controls">
    <div class="format" role="group" aria-label="Clock format">
      <button type="button" id="fmt12" aria-pressed="true">12 hour</button>
      <button type="button" id="fmt24" aria-pressed="false">24 hour</button>
    </div>
    <div class="format" role="group" aria-label="Seconds">
      <button type="button" id="secOff" aria-pressed="true">No seconds</button>
      <button type="button" id="secOn" aria-pressed="false">Seconds</button>
    </div>
  </div>
</main>

<section class="timer-section">
  <div class="timer-kicker">Timer</div>
  <div class="presets" role="group" aria-label="Timer duration">
    <div class="presets-row">
      <button type="button" data-seconds="30">30s</button>
      <button type="button" data-seconds="60">1m</button>
      <button type="button" data-seconds="120">2m</button>
      <button type="button" data-seconds="180">3m</button>
    </div>
    <div class="presets-row">
      <button type="button" data-seconds="300">5m</button>
      <button type="button" data-seconds="600">10m</button>
      <button type="button" data-seconds="900">15m</button>
    </div>
  </div>
  <div class="timer-display" id="timerDisplay">--:--</div>
  <div class="timer-status" id="timerStatus">Choose a duration to start.</div>
  <button type="button" class="timer-reset" id="timerReset">Stop</button>
</section>

<script>
  // Timetables in minutes after midnight. The last entry ends the school day.
  var MON_THU = [
    [8 * 60 + 25, "Enrichment / Assembly", "other"],
    [9 * 60,      "Period 1", "period"],
    [10 * 60,     "Period 2", "period"],
    [11 * 60,     "Break", "other"],
    [11 * 60 + 20, "Period 3", "period"],
    [12 * 60 + 20, "Period 4", "period"],
    [13 * 60 + 20, "Lunch", "other"],
    [13 * 60 + 55, "Period 5", "period"],
    [14 * 60 + 55, "End of Day", "end"]
  ];
  var FRIDAY = [
    [8 * 60 + 25, "Enrichment / Assembly", "other"],
    [8 * 60 + 40, "Period 1", "period"],
    [9 * 60 + 40, "Period 2", "period"],
    [10 * 60 + 40, "Break", "other"],
    [11 * 60,     "Period 3", "period"],
    [12 * 60,     "Period 4", "period"],
    [13 * 60,     "Lunch", "other"],
    [13 * 60 + 40, "Period 5", "period"],
    [14 * 60 + 40, "End of Day", "end"]
  ];

  var fmt = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/London",
    weekday: "short",
    hour: "numeric",
    minute: "numeric",
    second: "numeric",
    hourCycle: "h23"
  });

  function londonNow() {
    var out = {};
    fmt.formatToParts(new Date()).forEach(function (p) { out[p.type] = p.value; });
    return {
      weekday: out.weekday,
      seconds: (+out.hour) * 3600 + (+out.minute) * 60 + (+out.second)
    };
  }

  var use24 = false;
  try { use24 = localStorage.getItem("sandonClock24") === "1"; } catch (e) {}

  var useSecs = false;
  try { useSecs = localStorage.getItem("sandonClockSecs") === "1"; } catch (e) {}

  function clockText(secs) {
    var h24 = Math.floor(secs / 3600) % 24;
    var m = Math.floor((secs % 3600) / 60);
    var sec = secs % 60;
    var mm = (m < 10 ? "0" : "") + m;
    // Dot for plain 12 hour times (2.53pm); colon for 24 hour or when seconds are shown.
    var sepChar = (use24 || useSecs) ? ":" : ".";
    var ss = useSecs ? sepChar + (sec < 10 ? "0" : "") + sec : "";
    if (use24) {
      return (h24 < 10 ? "0" : "") + h24 + sepChar + mm + ss;
    }
    var suffix = h24 >= 12 ? "pm" : "am";
    var h = h24 % 12 === 0 ? 12 : h24 % 12;
    return h + sepChar + mm + ss + suffix;
  }

  function remainingText(secs) {
    var m = Math.floor(secs / 60);
    var s = secs % 60;
    if (m >= 60) {
      var h = Math.floor(m / 60);
      return h + " hr " + (m % 60) + " min";
    }
    if (m === 0) return s + " s";
    return m + " min " + (s < 10 ? "0" : "") + s + " s";
  }

  var els = {
    time: document.getElementById("time"),
    desc: document.getElementById("desc"),
    remaining: document.getElementById("remaining")
  };

  function tick() {
    var now = londonNow();
    var weekend = now.weekday === "Sat" || now.weekday === "Sun";
    var table = now.weekday === "Fri" ? FRIDAY : MON_THU;
    var s = now.seconds;
    var state = "closed";
    var desc = "The Sandon School is closed.";
    var remaining = "";

    if (!weekend) {
      for (var i = 0; i < table.length - 1; i++) {
        var start = table[i][0] * 60;
        var next = table[i + 1];
        if (s >= start && s < next[0] * 60) {
          var seg = table[i];
          desc = seg[1];
          if (seg[2] === "period") {
            var elapsed = s - start;
            state = elapsed < 45 * 60 ? "green" : elapsed < 55 * 60 ? "orange" : "red";
          } else {
            state = "blue";
          }
          var left = next[0] * 60 - s;
          var target = next[2] === "end" ? "the end of the school day" : next[1];
          remaining = "<strong>" + remainingText(left) + "</strong> until " + target;
          break;
        }
      }
    }

    document.body.setAttribute("data-state", state);
    els.time.textContent = clockText(s);
    els.time.classList.toggle("with-seconds", useSecs);
    els.desc.textContent = desc;
    els.remaining.innerHTML = remaining;
    document.title = clockText(s) + " " + desc.replace(/\.$/, "");
  }

  var btn12 = document.getElementById("fmt12");
  var btn24 = document.getElementById("fmt24");

  function setFormat(is24) {
    use24 = is24;
    btn12.setAttribute("aria-pressed", String(!is24));
    btn24.setAttribute("aria-pressed", String(is24));
    try { localStorage.setItem("sandonClock24", is24 ? "1" : "0"); } catch (e) {}
    tick();
  }
  btn12.addEventListener("click", function () { setFormat(false); });
  btn24.addEventListener("click", function () { setFormat(true); });

  var btnSecOff = document.getElementById("secOff");
  var btnSecOn = document.getElementById("secOn");

  function setSeconds(on) {
    useSecs = on;
    btnSecOff.setAttribute("aria-pressed", String(!on));
    btnSecOn.setAttribute("aria-pressed", String(on));
    try { localStorage.setItem("sandonClockSecs", on ? "1" : "0"); } catch (e) {}
    tick();
  }
  btnSecOff.addEventListener("click", function () { setSeconds(false); });
  btnSecOn.addEventListener("click", function () { setSeconds(true); });

  btn12.setAttribute("aria-pressed", String(!use24));
  btn24.setAttribute("aria-pressed", String(use24));
  btnSecOff.setAttribute("aria-pressed", String(!useSecs));
  btnSecOn.setAttribute("aria-pressed", String(useSecs));
  tick();
  setInterval(tick, 500);

  // --- Timer ---------------------------------------------------------
  var audioCtx = null;
  function unlockAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().catch(function () {});
    }
  }

  // A soft four-note bell arpeggio, in the spirit of a station announcement
  // chime, rather than a recording of any particular network's jingle.
  function playChime() {
    if (!audioCtx) return;
    var now = audioCtx.currentTime;
    var notes = [659.25, 783.99, 987.77, 1318.51];
    notes.forEach(function (freq, i) {
      var t = now + i * 0.19;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.28, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0008, t + 1.3);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 1.35);
    });
  }

  var timerDisplay = document.getElementById("timerDisplay");
  var timerStatus = document.getElementById("timerStatus");
  var timerResetBtn = document.getElementById("timerReset");
  var presetButtons = Array.prototype.slice.call(document.querySelectorAll(".presets button"));
  var timerEndAt = null;
  var timerLabel = "";
  var timerHandle = null;

  function mmss(totalSeconds) {
    var m = Math.floor(totalSeconds / 60);
    var s = totalSeconds % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function clearActivePreset() {
    presetButtons.forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
  }

  function stopTimer(resetText) {
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
    timerEndAt = null;
    clearActivePreset();
    timerDisplay.classList.remove("finished");
    timerDisplay.textContent = "--:--";
    timerStatus.textContent = resetText || "Choose a duration to start.";
    timerResetBtn.classList.remove("visible");
  }

  function timerTick() {
    var remaining = Math.round((timerEndAt - Date.now()) / 1000);
    if (remaining <= 0) {
      clearInterval(timerHandle);
      timerHandle = null;
      timerDisplay.textContent = "00:00";
      timerDisplay.classList.add("finished");
      timerStatus.textContent = "Time's up (" + timerLabel + ")";
      timerResetBtn.textContent = "Reset";
      playChime();
      return;
    }
    timerDisplay.textContent = mmss(remaining);
    timerStatus.textContent = "Counting down from " + timerLabel + "…";
  }

  presetButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      unlockAudio();
      var secs = parseInt(btn.getAttribute("data-seconds"), 10);
      timerLabel = btn.textContent;
      if (timerHandle) clearInterval(timerHandle);
      clearActivePreset();
      btn.setAttribute("aria-pressed", "true");
      timerEndAt = Date.now() + secs * 1000;
      timerDisplay.classList.remove("finished");
      timerDisplay.textContent = mmss(secs);
      timerStatus.textContent = "Counting down from " + timerLabel + "…";
      timerResetBtn.classList.add("visible");
      timerResetBtn.textContent = "Stop";
      timerHandle = setInterval(timerTick, 250);
    });
  });

  timerResetBtn.addEventListener("click", function () {
    stopTimer("Choose a duration to start.");
  });
</script>
</body>
</html>
